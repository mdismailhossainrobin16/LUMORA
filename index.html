<style>

.in{box-shadow:inset 5px 5px 10px var(--sh2),inset -5px -5px 10px var(--sh1);border-radius:16px}

nav .w{display:flex;align-items:center;gap:12px;height:64px}
.logo{font-weight:700;font-size:1.3rem;display:flex;gap:8px;align-items:center;margin-right:auto}
.links{display:flex;gap:18px;font-size:.92rem}.links a{color:var(--mu);text-decoration:none;transition:.2s}.links a:hover{color:var(--ac)}
.sm{padding:6px 14px;font-size:.85rem}

.g{background:linear-gradient(90deg,var(--ac),var(--ac2));-webkit-background-clip:text;background-clip:text;color:transparent}
.row{display:flex;gap:14px;flex-wrap:wrap}
.tag{display:inline-block;padding:4px 14px;border-radius:50px;font-size:.85rem;color:var(--ac);margin-bottom:14px}
.art{position:relative;aspect-ratio:1;max-width:440px;margin:auto;width:100%;transition:transform .2s}

.fl{animation:fl 5s ease-in-out infinite}.fl2{animation:fl 6s ease-in-out -2s infinite}

.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(210px,1fr));gap:22px}
.ic{width:54px;height:54px;border-radius:16px;display:grid;place-items:center;margin-bottom:12px;font-size:1.6rem}
.rv{opacity:0;transform:translateY(34px);transition:.8s cubic-bezier(.2,.7,.2,1)}.rv.v{opacity:1;transform:none}
.steps{counter-reset:s;display:grid;gap:14px}
.steps li{list-style:none;display:flex;gap:14px;padding:14px 16px;align-items:flex-start}
.steps li:before{counter-increment:s;content:counter(s);flex:none;width:32px;height:32px;border-radius:50%;display:grid;place-items:center;color:#fff;font-weight:700;background:linear-gradient(135deg,var(--ac),var(--ac2))}
.two{display:grid;grid-template-columns:1fr 1fr;gap:22px}@media(max-width:800px){.two{grid-template-columns:1fr}}
.steps li>div{min-width:0;flex:1}
#vm{position:fixed;inset:0;z-index:100;display:none;place-items:center;padding:20px;background:#050a18cc;backdrop-filter:blur(6px)}

.vbox .fr{position:relative;aspect-ratio:16/9;border-radius:14px;overflow:hidden;background:#000}.vbox iframe{position:absolute;inset:0;width:100%;height:100%;border:0}
.vmsg{padding:30px 20px;text-align:center;color:var(--mu)}
code{background:#2f6bff22;padding:1px 8px;border-radius:8px;color:var(--ac);word-break:break-all;font-size:.9em}
.note{margin-top:20px;padding:16px 20px;color:var(--mu);font-size:.93rem}
#dg{width:100%;height:auto}.dash{stroke-dasharray:8 8;animation:da 1s linear infinite}@keyframes da{to{stroke-dashoffset:-16}}

.fq{margin-bottom:14px;padding:0;overflow:hidden}.fq button{all:unset;box-sizing:border-box;width:100%;padding:18px 22px;cursor:pointer;font-weight:600;display:flex;justify-content:space-between;gap:10px}
.fq .a{display:grid;grid-template-rows:0fr;transition:grid-template-rows .4s}.fq.o .a{grid-template-rows:1fr}.fq .a p{overflow:hidden;padding:0 22px;color:var(--mu)}.fq.o .a p{padding-bottom:18px}

.cta{text-align:center;padding:60px 24px;background:linear-gradient(135deg,var(--ac),var(--ac2));color:#fff;border-radius:36px;position:relative;overflow:hidden}
.cta:before{content:"";position:absolute;width:300px;height:300px;border-radius:50%;background:#fff2;top:-100px;left:-60px;animation:fl 7s infinite}
.cta .btn{margin-top:20px}
footer{padding:40px 0 30px;color:var(--mu);font-size:.9rem;text-align:center}
@media(prefers-reduced-motion:reduce){*,*:before{animation:none!important;transition:none!important}.rv{opacity:1;transform:none}html{scroll-behavior:auto}}

/* ---------- Behaviour ---------- */
const RM=matchMedia('(prefers-reduced-motion:reduce)').matches;
function bind(){
const $=s=>document.querySelectorAll(s);
const io=new IntersectionObserver(e=>e.forEach(x=>x.isIntersecting&&(x.target.classList.add('v'),io.unobserve(x.target))),{threshold:.12});
$('.rv').forEach(e=>io.observe(e));
$('.btn').forEach(b=>b.addEventListener('click',e=>{if(RM)return;const r=b.getBoundingClientRect(),s=document.createElement('span');s.className='rp';const d=Math.max(r.width,r.height)/4;s.style.cssText=`width:${d}px;height:${d}px;left:${e.clientX-r.left-d/2}px;top:${e.clientY-r.top-d/2}px`;b.appendChild(s);setTimeout(()=>s.remove(),600)}));
lg.onclick=()=>{L=L==='bn'?'en':'bn';document.documentElement.lang=L;try{localStorage.setItem('l',L)}catch(e){}const y=scrollY;render();scrollTo(0,y)};
th.onclick=()=>{const r=document.documentElement,d=r.dataset.theme==='dark'||(!r.dataset.theme&&matchMedia('(prefers-color-scheme:dark)').matches);r.dataset.theme=d?'light':'dark'};
ft.onclick=()=>{filt=!filt;const y=scrollY;render();scrollTo(0,y)};
$('.fq button').forEach(b=>b.onclick=()=>b.parentElement.classList.toggle('o'));
$('[data-copy]').forEach(b=>b.addEventListener('click',async()=>{const ok=await copyText(b.dataset.copy);b.firstChild.nodeValue=ok?'✅ '+T('কপি হয়েছে','Copied'):'⚠️ '+T('কপি হয়নি, হাতে কপি করুন','Copy failed — copy manually');setTimeout(()=>{b.firstChild.nodeValue='📋 '+T('কপি করুন','Copy')},1800)}));
document.getElementById('vb').onclick=openVideo;
const nv=document.getElementById('nv');onscroll=()=>nv.classList.toggle('s',scrollY>10);
const a=document.getElementById('art');
if(!RM)addEventListener('pointermove',e=>{const x=(e.clientX/innerWidth-.5)*16,y=(e.clientY/innerHeight-.5)*16;a.style.transform=`perspective(800px) rotateY(${x}deg) rotateX(${-y}deg)`;mx=e.clientX;my=e.clientY},{passive:true});
}
let mx=-999,my=-999;
const vm=document.getElementById('vm'),vc=document.getElementById('vc');
function openVideo(){const e=embedUrl(VIDEO_URL);
vc.innerHTML=e?`<div class="fr"><iframe src="${e}" title="Setup video" allow="autoplay; encrypted-media; picture-in-picture; fullscreen" allowfullscreen referrerpolicy="strict-origin-when-cross-origin"></iframe></div><p class="vmsg" style="padding:12px">${T('ভিডিও না চললে','If the video does not load')}: <a href="${VIDEO_URL}" target="_blank" rel="noopener" style="color:var(--ac)">${T('নতুন ট্যাবে খুলুন','open in a new tab')}</a></p>`:`<div class="vmsg">🎬 ${T('ভিডিও লিংক এখনো যোগ করা হয়নি।','The video link has not been added yet.')}<br><small>${T('কোডে <code>VIDEO_URL</code> এ YouTube বা Google Drive লিংক বসান।','Set a YouTube or Google Drive link in <code>VIDEO_URL</code> in the code.')}</small></div>`;
vm.classList.add('o');vm.setAttribute('aria-hidden','false')}
function closeVideo(){vm.classList.remove('o');vm.setAttribute('aria-hidden','true');vc.innerHTML=''}
document.getElementById('vx').onclick=closeVideo;vm.addEventListener('click',e=>{if(e.target===vm)closeVideo()});addEventListener('keydown',e=>{if(e.key==='Escape')closeVideo()});
/* ---------- Particle network ---------- */
(function(){const c=document.getElementById('bg'),x=c.getContext('2d');let w,h,P=[];
function rs(){w=c.width=innerWidth;h=c.height=innerHeight;const n=RM?0:Math.min(70,Math.floor(w*h/18000));P=Array.from({length:n},()=>({x:Math.random()*w,y:Math.random()*h,vx:(Math.random()-.5)*.4,vy:(Math.random()-.5)*.4}))}
function f(){x.clearRect(0,0,w,h);const dk=getComputedStyle(document.body).color.match(/\d+/g)[0]>150,col=dk?'20,200,180':'47,107,255';
P.forEach((p,i)=>{p.x+=p.vx;p.y+=p.vy;if(p.x<0||p.x>w)p.vx*=-1;if(p.y<0||p.y>h)p.vy*=-1;
x.fillStyle=`rgba(${col},.7)`;x.beginPath();x.arc(p.x,p.y,2,0,6.3);x.fill();
for(let j=i+1;j<P.length;j++){const q=P[j],d=Math.hypot(p.x-q.x,p.y-q.y);if(d<130){x.strokeStyle=`rgba(${col},${.22*(1-d/130)})`;x.beginPath();x.moveTo(p.x,p.y);x.lineTo(q.x,q.y);x.stroke()}}
const d=Math.hypot(p.x-mx,p.y-my);if(d<160){x.strokeStyle=`rgba(${col},.5)`;x.beginPath();x.moveTo(p.x,p.y);x.lineTo(mx,my);x.stroke()}});
if(!document.hidden)requestAnimationFrame(f);else setTimeout(f,500)}
addEventListener('resize',rs);rs();if(!RM)f();})();
render();
</script></body></html>
